<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Contact form></title>
</head>
<body>
 <header>
    <h1>Welcome to My profile</h1>
    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
 </header> 
 <main>
    <section id="about">
        <h2>About Me</h2>
        <p>I am learning Web Application Development</p>
    </section>
    <section id="contact">
        <h2>Contact Me</h2>
        <form action="#" method="POST">
            <div>
                <label for="full-name">Full-Name</label>
                <input type="text" id="full-name" name="full-name" required placeholder="Enzama Maxwell">
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="enzamamaxwell90@gmail.com" required placeholder="enzamamaxwell90@gmail.com">
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Whats in your mind?"></textarea>
                </div>
                <button type="submit">Send Message</button>
        </form>
    </section>
 </main>
 <footer>
    <p>&copy;2026-All Rights Reserved</p>
 </footer>  
</body>
</html>
